[workspace]
resolver = "3"

members = [
  "crates/gst-meet",
  "crates/gst-recorder", "crates/render",
]

default-members =  ["crates/gst-recorder"]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
config = "0.15.22"
log = "0.4.29"
env_logger = "0.11.9"

gstreamer = "0.25.3"
gstreamer-sdp = "0.25.3"
gstreamer-webrtc = {version = "0.25.2", features = ["v1_18", "v1_22"]}
gstreamer-editing-services = "0.25.2"

cairo-rs ={version = "0.22.0", features = ["png"]}
regex = "1.13.0"
unicode-segmentation = "1.13.3"

webrtc-sdp = "0.3.13"
libstrophe = "0.20.3"
tiny_http = "0.12.0"
chrono = "0.4.44"
thiserror = "2.0.18"
nanoid = "0.5.0"
serde_json = "1.0.149"
serde = {version = "1.0.228", features = ["derive"]}
